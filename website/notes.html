<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes · Elyvris</title>
  <meta name="description" content="Private notes for your photonics work: text, pen drawings, images and calculations, saved only in your own browser.">
  <meta name="theme-color" content="#11161C">
  <link rel="icon" href="favicon.svg?v=20" type="image/svg+xml">
  <link rel="stylesheet" href="home.css?v=5">
  <link rel="stylesheet" href="notes.css?v=3">
  <script defer src="notes.js?v=5"></script>
  <link rel="canonical" href="https://diogo-poeta.github.io/elyvris/studio.html">
</head>
<body class="notes-page">
  <noscript><p>Enable JavaScript to use Notes in <a href="studio.html">Studio</a>.</p></noscript>

  <main id="main" class="notes wrap">
    <!-- The list of notes: small cards, like the Research page. -->
    <section id="notes-list" aria-labelledby="notes-title">
      <header class="notes-head">
        <div>
          <h1 id="notes-title" class="visually-hidden">Your notes</h1>
          <p class="notes-lede">Write, draw, add images or calculate. Saved on this browser.</p>
        </div>
        <div class="notes-actions">
          <button type="button" class="n-btn n-primary" id="note-new">New note</button>
          <button type="button" class="n-btn" id="notes-export">Save a copy</button>
          <label class="n-btn" for="notes-import">Open a copy</label>
          <input type="file" id="notes-import" accept=".json,application/json" hidden>
        </div>
      </header>
      <ol class="note-cards" id="note-cards"></ol>
      <p class="notes-empty" id="notes-empty" hidden>No notes yet. Press “New note” to start.</p>
      <p class="notes-small" id="notes-storage"></p>
    </section>

    <!-- One open note. -->
    <section id="note-editor" class="note-editor" hidden aria-label="Note">
      <div class="editor-bar">
        <button type="button" class="n-btn" id="note-back">← All notes</button>
        <span class="editor-status" id="note-status" aria-live="polite"></span>
        <button type="button" class="n-btn" id="note-save-text" title="Download written text, captions and calculations">Save TXT</button>
        <button type="button" class="n-btn n-danger" id="note-delete">Delete note</button>
      </div>
      <input type="text" id="note-title" class="note-title" placeholder="Title" aria-label="Title of the note" maxlength="140">
      <p class="note-dates" id="note-dates"></p>
      <div id="note-blocks" class="note-blocks"></div>
      <div class="add-block" role="group" aria-label="Add to this note">
        <span>Add</span>
        <button type="button" class="n-btn" data-add="text">Text</button>
        <button type="button" class="n-btn" data-add="drawing">Drawing</button>
        <button type="button" class="n-btn" data-add="image">Image</button>
        <button type="button" class="n-btn" data-add="calc">Calculation</button>
      </div>
      <input type="file" id="image-pick" accept="image/*" hidden>
    </section>
  </main>

</body>
</html>
