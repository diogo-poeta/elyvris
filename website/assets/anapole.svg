<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 550" role="img" aria-labelledby="title desc">
  <title id="title">Optical anapole: internal excitation with a suppressed radiation channel</title>
  <desc id="desc">An incident field drives a dielectric particle. Simplified closed displacement-current loops stand for an internal current pattern. Electric and phase-weighted toroidal terms have opposing far-field amplitudes in the shared electric dipole radiation channel. Their sum is small, while near fields remain. This schematic is qualitative and not an FDTD result.</desc>
  <defs><marker id="greenArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#739253" stroke-width="1.5"/></marker><marker id="earthArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#ac8667" stroke-width="1.5"/></marker></defs>
  <rect width="1120" height="550" rx="5" fill="#19372f"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#eff2e6">
    <text x="42" y="43" font-size="11" fill="#d0dcbf" letter-spacing="1.5">AN INTERFERENCE CONDITION</text><text x="42" y="82" font-size="30" font-family="Georgia,serif">Internal excitation need not mean strong far-field scattering.</text>
    <path d="M545 121V431" stroke="#52674f"/><text x="42" y="139" font-size="12" fill="#d0dcbf">INDUCED CURRENT PATTERN</text><text x="580" y="139" font-size="12" fill="#d0dcbf">SHARED ELECTRIC-DIPOLE RADIATION CHANNEL</text>
    <rect x="194" y="185" width="229" height="190" rx="9" fill="#274c3d" stroke="#92aa73"/>
    <g fill="none" stroke="#d7ef9e" stroke-width="2.2" marker-end="url(#greenArrow)"><path d="M243 211C214 211 210 250 214 279S240 333 258 319 271 263 259 239"/><path d="M371 211C400 211 404 250 400 279S374 333 356 319 343 263 355 239"/></g>
    <path d="M307 328V223" fill="none" stroke="#ac8667" stroke-width="2.3" marker-end="url(#earthArrow)"/>
    <text x="321" y="274" font-family="Georgia,serif" font-size="21" fill="#dbc3a3">p</text>
    <g fill="none" stroke="#91ad70" stroke-width="2" marker-end="url(#greenArrow)"><path d="M50 244H160"/><path d="M50 280H160"/><path d="M50 316H160"/></g><text x="47" y="221" font-size="12" fill="#d0dcbf">Incident light</text><text x="210" y="400" font-size="11" fill="#d0dcbf">Dielectric particle · qualitative cross-section</text>
    <text x="580" y="187" font-size="13">Electric contribution</text><path d="M585 227C604 227 604 198 623 198S642 256 661 256 680 198 699 198 718 256 737 256 756 227 775 227" fill="none" stroke="#d8f58a" stroke-width="2.3"/>
    <text x="818" y="229" font-size="13" fill="#d8f58a">E<tspan baseline-shift="sub" font-size="10">far,p</tspan></text>
    <text x="580" y="287" font-size="13">Phase-weighted toroidal contribution</text><path d="M585 327C604 327 604 356 623 356S642 298 661 298 680 356 699 356 718 298 737 298 756 327 775 327" fill="none" stroke="#c59c78" stroke-width="2.3"/>
    <text x="818" y="329" font-size="13" fill="#d4b392">E<tspan baseline-shift="sub" font-size="10">far,T</tspan></text>
    <path d="M580 372H1030" stroke="#52674f"/>
    <text x="580" y="408" font-size="14">Sum in this channel</text><path d="M776 402H910" stroke="#eff2e6" stroke-width="1.8"/><text x="936" y="408" font-family="Georgia,serif" font-size="23">≈ 0</text>
    <path d="M42 446H1078" stroke="#52674f"/>
    <text x="42" y="481" font-size="14" fill="#d8f58a">Non-zero internal fields</text><text x="423" y="481" font-size="14" fill="#d8f58a">Suppressed leading radiation</text><text x="807" y="481" font-size="14" fill="#d4b392">Other channels can remain</text>
    <text x="42" y="516" font-size="10" fill="#b9c8ae">Original explanatory schematic · current loops and wave amplitudes are illustrative, not simulated data or a universal field pattern.</text>
  </g>
</svg>
