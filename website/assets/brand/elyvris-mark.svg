<svg xmlns="http://www.w3.org/2000/svg" width="320" height="340" viewBox="0 0 320 340" role="img" aria-label="Elyvris"><title>Elyvris</title>
<!-- The mark assembles once each time a page loads: the three layers slide
     into place one after the other, then the amber path of light is drawn
     through them. Total time about 1.9 s. The same motion as the logo scene
     of the site tour (tour.js, scene 6). With "reduce motion" switched on in
     the system settings, the finished mark is shown at once. -->
<style>
  .layer { animation: layer-in .62s cubic-bezier(.33, 1, .68, 1) both; }
  #l0 { --from: -60px; animation-delay: .10s; }
  #l1 { --from: 0px;   animation-delay: .30s; }
  #l2 { --from: 60px;  animation-delay: .50s; }
  #beam { stroke-dasharray: 330; animation: beam-draw .80s cubic-bezier(.65, 0, .35, 1) 1.00s both; }
  @keyframes layer-in {
    from { opacity: 0; transform: translateY(var(--from)); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes beam-draw {
    from { stroke-dashoffset: 330; }
    to   { stroke-dashoffset: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .layer, #beam { animation: none; }
  }
</style>
<defs><mask id="cut-light" maskUnits="userSpaceOnUse" x="0" y="0" width="320" height="340"><rect width="320" height="340" fill="white"/><path d="M214 12L181 100V155L157 214V250L135 310" stroke="black" stroke-width="23" stroke-linejoin="round" fill="none"/></mask></defs>
<g mask="url(#cut-light)"><path id="l0" class="layer" d="M32 103L176 34L289 91L145 161Z" fill="#131B23"/><path id="l1" class="layer" d="M57 151L145 195L267 136V176L145 235L57 191Z" fill="#A38CD9"/><path id="l2" class="layer" d="M83 235L145 266L242 219V256L145 303L83 272Z" fill="#131B23"/></g>
<path id="beam" d="M214 12L181 100V155L157 214V250L135 310" stroke="#EFB653" stroke-width="7" stroke-linejoin="round" stroke-linecap="square" fill="none"/>
</svg>
